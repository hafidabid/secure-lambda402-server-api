# HTTP only: certbot adds the HTTPS server block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name secure-lambda-api.projectdeadwood.my.id;

    # Sealed datasets and models are uploaded through the API (MAX_UPLOAD_BYTES defaults to 1 MiB).
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Run progress is streamed over Server-Sent Events.
        proxy_buffering off;
    }
}
